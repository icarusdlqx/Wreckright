<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the game paint under the notch; the layout pads
         itself back out with the safe-area insets. Browser zoom remains available
         when the battlefield or a dense report needs a closer look. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1013" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IRONMUSTER" />
    <!-- No service worker on purpose: the single-file build is the offline
         story, and a stale-cache bug is worse than a network round trip. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%274%27%20fill%3D%27%2312303a%27%2F%3E%3Cpath%20d%3D%27M5%205h22v22H5z%27%20fill%3D%27none%27%20stroke%3D%27%23f1d4a4%27%2F%3E%3Cpath%20d%3D%27M8%2010h5m-2.5%200v12M8%2022h5m3%200V10l4%206%204-6v12%27%20fill%3D%27none%27%20stroke%3D%27%23f4a65b%27%20stroke-width%3D%272%27%20stroke-linejoin%3D%27round%27%2F%3E%3C%2Fsvg%3E"
    />
    <title>IRONMUSTER</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
